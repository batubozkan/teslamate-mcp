name = "get_unusual_power_consumption"
description = "Lists individual drives whose rated-range consumption exceeds threshold_pct (range used as a percent of distance driven, default 150), with car name, date, distance (km), range used (km), consumption percentage, outside temperature (°C), and start/end locations (the geofence name where the drive has one). Drives under min_distance_km (default 5) are left out: over a short distance the range figures are rounding noise. Returns the top 10 by consumption by default. Optional filters: car_name, days, threshold_pct, min_distance_km, limit."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "Restrict to the last N days (N x 24 hours back from now). Omit for all time."
minimum = 1

[[params]]
name = "threshold_pct"
type = "number"
description = "Flag drives whose range consumption exceeds this percent of distance driven."
default = 150
minimum = 100
maximum = 1000

[[params]]
name = "min_distance_km"
type = "number"
description = "Only drives at least this long, in km. Lower it to include short drives."
default = 5
minimum = 0
maximum = 1000

[[params]]
name = "limit"
type = "integer"
description = "Maximum number of rows returned."
default = 10
minimum = 1
maximum = 100

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "start_date"
type = "string"

[[output]]
name = "distance"
type = "number"

[[output]]
name = "range_used"
type = "number"

[[output]]
name = "consumption_pct"
type = "number"

[[output]]
name = "outside_temp_avg"
type = "number"

[[output]]
name = "start_location"
type = "string"

[[output]]
name = "end_location"
type = "string"

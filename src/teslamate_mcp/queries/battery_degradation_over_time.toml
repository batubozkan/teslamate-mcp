name = "get_battery_degradation_over_time"
description = "Per-car battery degradation: monthly average and maximum rated range (km) from positions logged at 100% battery, with data-point counts, over the last 730 days by default (months bucketed in the report timezone; the window starts with the month that `days` ago falls in, so the first month is a whole one). Optional filters: car_name, days."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "How many days back to look."
default = 730
minimum = 28
maximum = 3650

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "month"
type = "string"

[[output]]
name = "avg_rated_range"
type = "number"

[[output]]
name = "max_rated_range"
type = "number"

[[output]]
name = "data_points"
type = "integer"

name = "get_all_charging_sessions_summary"
description = "Per-car charging summary: total sessions, total and average energy added (kWh), total and average charging time (minutes), total cost, and the sessions with no recorded cost. A session is a finished charge that added energy. The total cost is null, not 0, when no session has a cost. Covers all time by default. Optional filters: car_name, days."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "Restrict to the last N days (N x 24 hours back from now). Omit for all time."
minimum = 1

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "total_charging_sessions"
type = "integer"

[[output]]
name = "total_energy_added_kwh"
type = "number"

[[output]]
name = "avg_energy_per_session"
type = "number"

[[output]]
name = "total_charging_time_min"
type = "integer"

[[output]]
name = "avg_charging_time_min"
type = "number"

[[output]]
name = "total_charging_cost"
type = "number"

[[output]]
name = "sessions_without_cost"
type = "integer"
description = "Sessions with no recorded cost; the cost leaves them out."

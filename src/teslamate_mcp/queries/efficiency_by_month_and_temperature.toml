name = "get_efficiency_by_month_and_temperature"
description = "Returns per-car monthly driving stats bucketed by local calendar month over the last 365 days by default: average outside temperature (°C), total distance (km), drive count, average distance per drive (km), and consumption (wh_per_km: rated range used times the car's efficiency, over the distance driven). The window starts with the month that `days` ago falls in, so the first month is a whole one. Optional filters: car_name, days."

[[params]]
name = "car_name"
type = "string"
description = "Case-insensitive substring match on the car's name. Omit for all cars."

[[params]]
name = "days"
type = "integer"
description = "How many days back to look."
default = 365
minimum = 28

[[output]]
name = "car_name"
type = "string"

[[output]]
name = "month"
type = "string"

[[output]]
name = "avg_temp"
type = "number"

[[output]]
name = "total_distance_km"
type = "number"

[[output]]
name = "drive_count"
type = "integer"

[[output]]
name = "avg_distance_per_drive"
type = "number"

[[output]]
name = "wh_per_km"
type = "number"
description = "Consumption in Wh/km on the rated-range scale."

services:
  teslamate-mcp:
    build: .
    container_name: teslamate-mcp
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
      CF_ACCESS_TEAM_DOMAIN: ${CF_ACCESS_TEAM_DOMAIN:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
      POOL_MIN_SIZE: ${POOL_MIN_SIZE:-1}
      POOL_MAX_SIZE: ${POOL_MAX_SIZE:-10}
      STATEMENT_TIMEOUT_MS: ${STATEMENT_TIMEOUT_MS:-30000}
      QUERY_TIMEOUT_MS: ${QUERY_TIMEOUT_MS:-5000}
      CUSTOM_SQL_ROW_LIMIT: ${CUSTOM_SQL_ROW_LIMIT:-1000}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-UTC}
      MAP_TILES: ${MAP_TILES:-true}
      ENABLE_CHARGING_WRITES: ${ENABLE_CHARGING_WRITES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: ${DEBUG:-false}
